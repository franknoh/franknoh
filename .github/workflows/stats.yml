name: stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/stats.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render cards
        env:
          # STATS_TOKEN: a PAT with `repo` scope so private repos count too.
          # Without it the default token only sees public data.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python .github/scripts/stats.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add profile
          git diff --cached --quiet || git commit -m "Update stats cards [skip ci]"
          git push
